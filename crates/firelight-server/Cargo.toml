[package]
name = "firelight-server"
description = "HTTP: pages, /api/v1, /mcp, /webhook, health and readiness."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "1", features = ["net", "signal", "sync", "macros", "rt-multi-thread", "time"] }
firelight-source = { path = "../firelight-source" }
serde_json = "1"
tracing = "0.1"
thiserror = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
