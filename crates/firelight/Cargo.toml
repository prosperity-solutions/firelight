[package]
name = "firelight"
description = "One binary that turns the .firelight/ folders in your git repos into a link page, a help center, search and an MCP server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
firelight-format = { path = "../firelight-format" }
firelight-server = { path = "../firelight-server" }
firelight-source = { path = "../firelight-source" }
firelight-store = { path = "../firelight-store" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter", "ansi", "std"] }
url = "2"

[[bin]]
name = "firelight"
path = "src/main.rs"

[lints]
workspace = true
