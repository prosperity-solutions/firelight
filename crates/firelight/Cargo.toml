[package]
name = "firelight"
description = "One binary that turns the .firelight/ folders in your git repos into a link page, a help center, search and an MCP server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
firelight-embed = { path = "../firelight-embed" }
firelight-format = { path = "../firelight-format" }
firelight-search = { path = "../firelight-search" }
firelight-server = { path = "../firelight-server" }
firelight-source = { path = "../firelight-source" }
firelight-store = { path = "../firelight-store" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics", "rt-tokio"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics"] }
tracing-opentelemetry = { version = "0.34", default-features = false, features = ["tracing-log"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter", "ansi", "std"] }
url = "2"

[dev-dependencies]
rmcp = { version = "=3.9.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[[bin]]
name = "firelight"
path = "src/main.rs"

[lints]
workspace = true
