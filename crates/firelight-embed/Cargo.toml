[package]
name = "firelight-embed"
description = "The Embedder trait and its backends: candle, openai-compatible, off; model download and verification."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
candle-core = { version = "=0.11.0", default-features = false }
candle-nn = { version = "=0.11.0", default-features = false }
candle-transformers = { version = "=0.11.0", default-features = false }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt", "fs", "io-util"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[lints]
workspace = true
