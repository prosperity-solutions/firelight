[package]
name = "firelight-format"
description = "Types, YAML and markdown parsing, validation and ref resolution for the .firelight/ format. No I/O, no async."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false }
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
schemars = { version = "1", default-features = false, features = ["derive", "std"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["deserialize"] }
serde_json = "1"

[dev-dependencies]
insta = { version = "1", default-features = false }

[lints]
workspace = true
