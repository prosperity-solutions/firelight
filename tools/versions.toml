# Dev and CI tools, pinned (docs/HANDOVER.md §17.3). Run them with
# scripts/dev/t <name> [args…]; they install into the repo-local .tools/,
# never globally. Every version is at least 7 days old (tools/depage).
#
# A strict flat TOML subset: [name] sections, key = "string" lines.
#   kind = "cargo"  → cargo install --locked --version <version>
#   kind = "bin"    → a release download, checked against sha256_<os>_<arch>,
#                     with `released` (checked against GitHub's release by depage)
#   url             → {version} is replaced; {asset} is asset_<os>_<arch>
#   path            → the binary inside the archive ({version} replaced)

[cargo-deny]
kind = "cargo"
version = "0.20.2"

[cargo-about]
kind = "cargo"
version = "0.9.3"

[just]
kind = "cargo"
version = "1.59.0"

