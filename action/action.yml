# The Firelight GitHub Action (docs/HANDOVER.md §12.3): keeps a repo's
# .firelight/ true in its own CI. Pin it by commit:
#
#   - uses: actions/checkout@<sha> # vX
#     with: { fetch-depth: 0 }          # `covers` needs history
#   - uses: prosperity-solutions/firelight/action@<sha> # vX.Y.Z
#     with: { version: vX.Y.Z }
#
# It downloads that release's binary, checks it against SHA256SUMS and its
# GitHub attestation, then runs `firelight check`, `firelight preview --check`
# and, on pull requests, `firelight covers`. Each step's output goes into the
# job summary.
#
# `covers` is strict by default: a PR that changes paths an entry `covers`
# fails until the entry is updated, or someone says it is still correct with a
# commit trailer `Firelight-Covers: checked <repo>/<entry>` (`checked` alone
# for every flagged entry) or the `firelight-covers-checked` label. For the
# label to re-run the check, trigger on `pull_request` types `labeled` and
# `unlabeled` too. `strict-covers: false` turns failures back into warnings.
#
# Golden questions that expect entries in other repos are skipped unless those
# repos are loaded too: check them out next to this one (actions/checkout with
# `repository` and `path`, plus a token for private ones) and list their
# folders in `also`. See `firelight skills ci`.
name: Firelight
description: Check a repo's .firelight/ docs, run its golden questions, and flag maybe-stale entries.
author: prosperity-solutions
branding:
  icon: book-open
  color: orange

inputs:
  version:
    description: The Firelight release to use, like v0.3.0.
    required: true
  directory:
    description: The repo folder holding .firelight/.
    default: "."
  also:
    description: "More folders holding other repos' .firelight/, one per line, loaded next to `directory` by `firelight preview --check` so cross-repo golden questions run. Their errors fail the check too."
    default: ""
  embedder:
    description: "`off` (default, fast) or `candle` to run golden questions with meaning search (the model is cached)."
    default: "off"
  strict-covers:
    description: "`true` (default) fails the job while a covered path changed and its entry was neither updated nor acknowledged (`Firelight-Covers: checked` trailer or the `firelight-covers-checked` label). `false` only warns."
    default: "true"
  binary:
    description: For Firelight's own CI only - a firelight binary to use instead of a release.
    default: ""

runs:
  using: composite
  steps:
    - name: Install Firelight
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        BINARY: ${{ inputs.binary }}
        DEST: ${{ runner.temp }}/firelight-bin
        GH_TOKEN: ${{ github.token }}
      run: sh "$GITHUB_ACTION_PATH/install.sh"

    - name: Cache the model
      if: inputs.embedder == 'candle'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/firelight/models
        key: firelight-model-${{ inputs.version }}

    - name: firelight check
      shell: bash
      env:
        DIR: ${{ inputs.directory }}
      run: |
        set -o pipefail
        { echo '### firelight check'; echo '~~~~~~~~~~'; } >> "$GITHUB_STEP_SUMMARY"
        status=0
        "$RUNNER_TEMP/firelight-bin/firelight" check "$DIR" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
        echo '~~~~~~~~~~' >> "$GITHUB_STEP_SUMMARY"
        exit "$status"

    - name: firelight preview --check
      shell: bash
      env:
        DIR: ${{ inputs.directory }}
        ALSO: ${{ inputs.also }}
        EMBEDDER: ${{ inputs.embedder }}
      run: |
        set -o pipefail
        dirs=("$DIR")
        while IFS= read -r d; do
          d="${d#"${d%%[![:space:]]*}"}"; d="${d%"${d##*[![:space:]]}"}"
          if [ -n "$d" ]; then dirs+=("$d"); fi
        done <<< "$ALSO"
        { echo '### firelight preview --check'; echo '~~~~~~~~~~'; } >> "$GITHUB_STEP_SUMMARY"
        status=0
        "$RUNNER_TEMP/firelight-bin/firelight" preview --check --embedder "$EMBEDDER" -- "${dirs[@]}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
        echo '~~~~~~~~~~' >> "$GITHUB_STEP_SUMMARY"
        exit "$status"

    - name: firelight covers
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        DIR: ${{ inputs.directory }}
        BASE_REF: ${{ github.base_ref }}
        STRICT: ${{ inputs.strict-covers }}
        LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'firelight-covers-checked') }}
      run: |
        set -o pipefail
        git -C "$DIR" fetch --quiet --no-tags origin "$BASE_REF" || true
        flags=()
        if [ "$STRICT" != "false" ]; then flags+=(--strict); fi
        if [ "$LABELED" = "true" ]; then flags+=(--label-checked); fi
        { echo '### firelight covers'; echo '~~~~~~~~~~'; } >> "$GITHUB_STEP_SUMMARY"
        status=0
        "$RUNNER_TEMP/firelight-bin/firelight" covers --base "origin/$BASE_REF" "${flags[@]}" -- "$DIR" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
        echo '~~~~~~~~~~' >> "$GITHUB_STEP_SUMMARY"
        # 2 = covers couldn't tell (e.g. a shallow clone): a warning by default.
        if [ "$status" = 2 ] && [ "$STRICT" = "false" ]; then
          echo "::warning::firelight covers couldn't compare with the base; check out with fetch-depth: 0"
          exit 0
        fi
        exit "$status"
